<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>foxbridge</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <header>
    <h1>foxbridge</h1>
    <p id="status" class="off">Off</p>
  </header>
  <div class="row">
    <button id="power" type="button">Turn on</button>
    <button id="stop" type="button" class="danger" title="Close the bridge, deny what waits, and stop sharing every tab">Stop now</button>
  </div>
  <p id="error" class="error" hidden></p>

  <section>
    <h2>Waiting for you</h2>
    <ul id="pending" class="cards"></ul>
  </section>

  <section>
    <h2>Tabs</h2>
    <p class="hint">An agent can use only the tabs you share. It can read a shared tab. Each change waits for you here.</p>
    <ul id="tabs" class="tabs"></ul>
  </section>

  <section>
    <h2>Activity</h2>
    <ol id="log" class="log"></ol>
  </section>

  <section>
    <h2>Settings</h2>
    <label class="setting">Approval time in seconds
      <input id="seconds" type="number" min="2" max="150" step="1">
    </label>
  </section>
  <script src="sidebar.js"></script>
</body>
</html>
